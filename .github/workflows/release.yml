name: Read-only Preview Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LegionLoqControl.sln --locked-mode

      - name: Build and test
        run: |
          dotnet build LegionLoqControl.sln --configuration Release --no-restore
          dotnet test LegionLoqControl.sln --configuration Release --no-build --no-restore

      - name: Publish
        shell: pwsh
        run: |
          $version = "0.0.0-preview.${{ github.run_number }}"
          dotnet publish LegionLoqControl/LegionLoqControl.csproj `
            --configuration Release `
            --output preview `
            --no-restore `
            --self-contained false `
            -p:Version=$version `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:IncludeBrokerArtifacts=false

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Add license and safety documents
        shell: pwsh
        run: |
          Copy-Item LICENSE preview/
          Copy-Item THIRD-PARTY-NOTICES.md preview/
          Copy-Item README.md preview/
          Copy-Item SAFETY.md preview/
          Copy-Item SECURITY.md preview/
          Copy-Item docs/READ_ONLY_PREVIEW.md preview/

      - name: Verify unelevated preview boundary
        shell: pwsh
        run: |
          $required = @(
            "LegionLoqControl.exe",
            "LegionLoqControl.dll",
            "LICENSE",
            "THIRD-PARTY-NOTICES.md",
            "READ_ONLY_PREVIEW.md",
            "SAFETY.md"
          )

          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path preview $name) -PathType Leaf)) {
              throw "Missing required preview artifact: $name"
            }
          }

          $brokerArtifacts = @(Get-ChildItem preview -File -Filter "LegionLoqControl.Broker*")
          if ($brokerArtifacts.Count -ne 0) {
            throw "Unsigned elevated broker artifacts must not enter preview packages."
          }

      - name: Upload short-lived preview
        uses: actions/upload-artifact@v4
        with:
          name: LegionLoqControl-read-only-preview-${{ github.run_number }}
          path: preview/
          if-no-files-found: error
          retention-days: 7
