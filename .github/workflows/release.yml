name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore locked dependencies
        run: dotnet restore LegionLoqControl.sln --locked-mode

      - name: Build and test
        run: |
          dotnet build LegionLoqControl.sln --configuration Release --no-restore
          dotnet test LegionLoqControl.sln --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish LegionLoqControl/LegionLoqControl.csproj --configuration Release --output publish --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath LegionLoqControl-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: LegionLoqControl-*.zip
          generate_release_notes: true
