name: Read-only Preview Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LegionLoqControl.sln --locked-mode

      - name: Build and test
        run: |
          dotnet build LegionLoqControl.sln --configuration Release --no-restore
          dotnet test LegionLoqControl.sln --configuration Release --no-build --no-restore

      - name: Verify accessibility and UI safety contracts
        shell: pwsh
        run: ./scripts/test-accessibility-contracts.ps1

      - name: Build and verify broker-free preview
        shell: pwsh
        run: >
          ./scripts/build-read-only-preview.ps1
          -OutputPath preview
          -Version "0.0.0-preview.${{ github.run_number }}"

      - name: Smoke test broker-free preview startup
        shell: pwsh
        run: ./scripts/test-read-only-preview-startup.ps1 -PreviewPath preview

      - name: Upload short-lived preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LegionLoqControl-read-only-preview-${{ github.run_number }}
          path: preview/
          if-no-files-found: error
          retention-days: 7
