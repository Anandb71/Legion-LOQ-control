name: Watch LLT Reference

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Compare LLT reference, fork, and upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "LegionLoqControl-reference-watch"
          }

          function Invoke-GitHubApi {
            param(
              [Parameter(Mandatory)] [string] $Path,
              [string] $Method = "GET",
              [object] $Body
            )

            $parameters = @{
              Uri = "https://api.github.com$Path"
              Headers = $headers
              Method = $Method
            }

            if ($null -ne $Body) {
              $parameters.ContentType = "application/json"
              $parameters.Body = $Body | ConvertTo-Json -Depth 8
            }

            Invoke-RestMethod @parameters
          }

          $reference = Invoke-GitHubApi `
            "/repos/$env:REPOSITORY/contents/LLT_Reference?ref=$env:CURRENT_COMMIT"
          $fork = Invoke-GitHubApi `
            "/repos/Anandb71/LenovoLegionToolkit/branches/master"
          $upstream = Invoke-GitHubApi `
            "/repos/LenovoLegionToolkit-Team/LenovoLegionToolkit/branches/master"

          $referenceSha = $reference.sha
          $forkSha = $fork.commit.sha
          $upstreamSha = $upstream.commit.sha
          $needsForkSync = $forkSha -ne $upstreamSha
          $needsPointerUpdate = $referenceSha -ne $forkSha

          $title = "LLT reference update available"
          $body = @"
          The scheduled reference check found drift.

          | Location | Commit |
          |---|---|
          | Product submodule | ``$referenceSha`` |
          | Anandb71 fork | ``$forkSha`` |
          | Active team upstream | ``$upstreamSha`` |

          Fork sync required: **$needsForkSync**
          Product pointer update required: **$needsPointerUpdate**

          Run ``scripts/sync-llt-reference.ps1``, review the upstream diff, update
          ``docs/OSS-SOURCES.md``, run the relevant tests, and commit the gitlink.

          This workflow deliberately does not merge upstream code automatically.
          "@

          $openIssues = Invoke-GitHubApi `
            "/repos/$env:REPOSITORY/issues?state=open&per_page=100"
          $existing = $openIssues | Where-Object { $_.title -eq $title } |
            Select-Object -First 1

          if ($needsForkSync -or $needsPointerUpdate) {
            if ($null -eq $existing) {
              Invoke-GitHubApi "/repos/$env:REPOSITORY/issues" "POST" @{
                title = $title
                body = $body
              } | Out-Null
            }
            else {
              Invoke-GitHubApi `
                "/repos/$env:REPOSITORY/issues/$($existing.number)" "PATCH" @{
                  body = $body
                } | Out-Null
            }
          }
          elseif ($null -ne $existing) {
            Invoke-GitHubApi `
              "/repos/$env:REPOSITORY/issues/$($existing.number)" "PATCH" @{
                state = "closed"
                state_reason = "completed"
                body = "The fork and product submodule now match active upstream at ``$upstreamSha``."
              } | Out-Null
          }

          Write-Host "reference=$referenceSha fork=$forkSha upstream=$upstreamSha"
