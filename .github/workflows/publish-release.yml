name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore and test portable projects
        run: |
          dotnet restore tests/LegionLoqControl.Application.Tests/LegionLoqControl.Application.Tests.csproj --locked-mode
          dotnet test tests/LegionLoqControl.Application.Tests/LegionLoqControl.Application.Tests.csproj --configuration Release --no-restore

      - name: Pack Linux portable libraries
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $out = Join-Path $env:RUNNER_TEMP "linux-portable"
          ./scripts/build-linux-portable.ps1 -OutputPath $out -Version $version
          $archive = Join-Path $env:RUNNER_TEMP "LegionLoqControl-$version-linux-portable.tar.gz"
          tar -czf $archive -C $out .
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach Linux archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then NOTES="CHANGELOG.md"; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "Legion + LOQ Control ${VERSION}" \
              --notes-file "$NOTES"
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber

  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LegionLoqControl.sln --locked-mode

      - name: Build
        run: dotnet build LegionLoqControl.sln --configuration Release --no-restore

      - name: Verify accessibility and UI safety contracts
        shell: pwsh
        run: ./scripts/test-accessibility-contracts.ps1

      - name: Test
        run: dotnet test LegionLoqControl.sln --configuration Release --no-build --no-restore

      - name: Verify broker-free preview package
        shell: pwsh
        run: >
          ./scripts/build-read-only-preview.ps1
          -OutputPath "$env:RUNNER_TEMP/LegionLoqControl-read-only-preview-${{ github.run_attempt }}"
          -Version "0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}"

      - name: Pack Windows development preview
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $out = Join-Path $env:RUNNER_TEMP "windows-release"
          ./scripts/build-windows-release.ps1 -OutputPath $out -Version $version
          $zip = Join-Path $env:RUNNER_TEMP "LegionLoqControl-$version-windows.zip"
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip
          "ARCHIVE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach Windows archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { $notes = "CHANGELOG.md" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Legion + LOQ Control $($env:VERSION)" --notes-file $notes
          }
          gh release upload $tag $env:ARCHIVE --clobber
