name: Build & Test

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LegionLoqControl.sln --locked-mode

      - name: Build
        run: dotnet build LegionLoqControl.sln --configuration Release --no-restore

      - name: Verify accessibility and UI safety contracts
        shell: pwsh
        run: ./scripts/test-accessibility-contracts.ps1

      - name: Test
        run: dotnet test LegionLoqControl.sln --configuration Release --no-build --no-restore
