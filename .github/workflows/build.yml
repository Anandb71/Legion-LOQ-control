name: Build & Test

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LegionLoqControl.sln --locked-mode

      - name: Build
        run: dotnet build LegionLoqControl.sln --configuration Release --no-restore

      - name: Verify accessibility and UI safety contracts
        shell: pwsh
        run: ./scripts/test-accessibility-contracts.ps1

      - name: Test
        run: dotnet test LegionLoqControl.sln --configuration Release --no-build --no-restore

      - name: Verify broker-free preview package
        shell: pwsh
        run: >
          ./scripts/build-read-only-preview.ps1
          -OutputPath "$env:RUNNER_TEMP/LegionLoqControl-read-only-preview-${{ github.run_attempt }}"
          -Version "0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}"

      - name: Smoke test broker-free preview startup
        shell: pwsh
        run: >
          ./scripts/test-read-only-preview-startup.ps1
          -PreviewPath "$env:RUNNER_TEMP/LegionLoqControl-read-only-preview-${{ github.run_attempt }}"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore portable tests
        run: dotnet restore tests/LegionLoqControl.Application.Tests/LegionLoqControl.Application.Tests.csproj --locked-mode

      - name: Test Domain and Application
        run: dotnet test tests/LegionLoqControl.Application.Tests/LegionLoqControl.Application.Tests.csproj --configuration Release --no-restore
